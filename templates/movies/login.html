{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Login - MovieFlix</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <h1>MovieFlix</h1>

        <h2>Sign In</h2>

        {% if messages %}

            {% for message in messages %}

                <p class="message">
                    {{ message }}
                </p>

            {% endfor %}

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            New to MovieFlix?

            <a href="{% url 'register' %}">
                Create an account
            </a>
        </p>

    </div>

</div>

</body>

</html>
